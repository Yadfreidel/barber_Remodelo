<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Toma tu turno en la fila de la barbería y sigue tu posición desde el teléfono.">
    <meta name="robots" content="noindex">
    <title>Fila virtual | Barbería</title>
    <meta name="theme-color" content="#0b0b0c">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/imagenes/icono-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="assets/css/fila.css">
</head>
<body class="fila-pagina">
    <header class="fila-marca">
        <span class="fila-emblema" aria-hidden="true"><i class="fas fa-scissors"></i></span>
        <span class="fila-nombre" data-negocio>Barbería</span>
        <span class="fila-etiqueta">Fila virtual</span>
    </header>
    <p class="fila-red" role="status" hidden><i class="fas fa-wifi" aria-hidden="true"></i> Sin conexión. Mostramos lo último que sabemos; se actualizará al reconectar.</p>
    <main id="fila" class="fila-contenido" aria-live="polite">
        <div class="fila-cargando"><span class="fila-esqueleto"></span><span class="fila-esqueleto corto"></span></div>
    </main>
    <footer class="fila-pie">
        <a href="./#contacto"><i class="fa-regular fa-calendar" aria-hidden="true"></i> Prefiero reservar una cita</a>
    </footer>
    <script type="module" src="assets/fila/fila-publica.js"></script>
</body>
</html>
